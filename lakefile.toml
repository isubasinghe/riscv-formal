name = "riscvc"
version = "0.1.0"
defaultTargets = ["Riscvc", "riscvc"]
testDriver = "riscvc_tests"

[[require]]
name = "riscv_sail"
path = "vendor/sail-riscv"

[[lean_lib]]
name = "Riscvc"
roots = ["Riscvc", "examples.LinkedList", "examples.proof.AppendProof", "examples.Scheduler", "examples.proof.SchedulerInit", "examples.proof.SchedulerSail", "examples.proof.SchedulerStepProgram", "examples.proof.SchedulerStepTactics", "examples.proof.SchedulerStepSegments", "examples.proof.SchedulerStep"]

[[lean_exe]]
name = "riscvc"
root = "Main"

[[lean_exe]]
name = "riscvc_tests"
root = "Tests"
